services:
  pulsezone:
    build:
      context: .
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.13}
    restart: unless-stopped
    env_file: .env
    environment:
      ZONE_PATH: /zones
      DATABASE_PATH: /app/data/pulsezone.sqlite3
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8080"
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ${ZONE_PATH:-./zones}:/zones:ro
      - pulsezone-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"

volumes:
  pulsezone-data:
