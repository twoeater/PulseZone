[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsezone"
version = "0.1.0"
description = "DNS zone based HTTP monitoring with in-memory metrics"
requires-python = ">=3.9"
dependencies = ["aiohttp==3.13.5", "dnspython==2.7.0", "python-dotenv==1.1.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "cryptography==46.0.3"]

[project.scripts]
pulsezone = "pulsezone.app:main"

[tool.setuptools.packages.find]
include = ["pulsezone*"]

[tool.setuptools.package-data]
pulsezone = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
